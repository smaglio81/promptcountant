<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 16 16" fill="none">
  <!-- Calculator body -->
  <rect x="4" y="1" width="11" height="14" rx="1.5"
        stroke="#C5C5C5" stroke-width="1" fill="none"/>
  <!-- Screen -->
  <rect x="5.5" y="2.5" width="8" height="2.5" rx="0.3"
        stroke="#C5C5C5" stroke-width="0.8" fill="none"/>
  <!-- Keypad (3x3 dots) -->
  <g fill="#C5C5C5">
    <circle cx="6.5"  cy="7.25" r="0.55"/>
    <circle cx="9.5"  cy="7.25" r="0.55"/>
    <circle cx="12.5" cy="7.25" r="0.55"/>
    <circle cx="6.5"  cy="9.5"  r="0.55"/>
    <circle cx="9.5"  cy="9.5"  r="0.55"/>
    <circle cx="12.5" cy="9.5"  r="0.55"/>
    <circle cx="6.5"  cy="11.75" r="0.55"/>
    <circle cx="9.5"  cy="11.75" r="0.55"/>
    <circle cx="12.5" cy="11.75" r="0.55"/>
  </g>
  <!-- Chat bubble in the bottom-left corner, overlapping the calculator -->
  <path d="M1 8.5
           a1.5 1.5 0 0 1 1.5 -1.5
           h3
           a1.5 1.5 0 0 1 1.5 1.5
           v1.5
           a1.5 1.5 0 0 1 -1.5 1.5
           h-1.4
           l-2.3 2.2
           v-2.2
           a1.5 1.5 0 0 1 -1.3 -1.5
           z"
        fill="var(--vscode-editor-background, #1e1e1e)"
        stroke="#C5C5C5" stroke-width="1" stroke-linejoin="round"/>
</svg>
